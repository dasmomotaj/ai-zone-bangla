{% extends "base.html" %}
{% block meta_desc %}AI Zone বাংলা টিমের সাথে যোগাযোগ করুন — মতামত ও প্রশ্ন পাঠান।{% endblock %}
{% block title %}যোগাযোগ | AI Zone বাংলা{% endblock %}
{% block content %}
<h1>📩 যোগাযোগ করুন</h1>
<form method="post" class="form card">
  <label>আপনার নাম<input type="text" name="name" required maxlength="100" placeholder="আপনার নাম"></label>
  <label>ইমেইল<input type="email" name="email" required maxlength="100" placeholder="you@email.com"></label>
  <label>মেসেজ<textarea name="message" required maxlength="2000" rows="5" placeholder="আপনার মতামত লিখুন..."></textarea></label>
  <button type="submit" class="btn">পাঠান</button>
</form>
{% endblock %}

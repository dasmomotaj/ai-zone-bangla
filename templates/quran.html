<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুরআন শিক্ষা — AI Zone বাংলা</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .quran-page {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .quran-hero {
            padding: 28px 20px;
            border-radius: 20px;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(135deg, #eef7f1, #f4f7ff);
        }

        .quran-hero h1 {
            margin-bottom: 10px;
        }

        .quran-hero p {
            margin: 0;
            line-height: 1.7;
        }

        .lesson-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .lesson-card {
            display: block;
            padding: 18px;
            border-radius: 16px;
            text-decoration: none;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            transition: transform 0.15s ease;
        }

        .lesson-card:hover {
            transform: translateY(-2px);
        }

        .lesson-number {
            font-size: 14px;
            opacity: 0.7;
        }

        .lesson-title {
            display: block;
            margin-top: 6px;
            font-size: 17px;
            font-weight: 700;
        }

        .lesson-arrow {
            display: block;
            margin-top: 10px;
            font-size: 14px;
        }

        .quran-note {
            margin-top: 24px;
            padding: 16px;
            border-radius: 14px;
            background: #fff8e8;
            line-height: 1.7;
        }

        @media (max-width: 600px) {
            .quran-page {
                padding: 14px;
            }

            .lesson-grid {
                grid-template-columns: 1fr;
            }

            .quran-hero {
                padding: 24px 16px;
            }
        }
    </style>
</head>

<body>

<main class="quran-page">

    <section class="quran-hero">
        <h1>📖 কুরআন শিক্ষা</h1>
        <p>
            একদম শুরু থেকে ধাপে ধাপে কুরআন পড়ার প্রাথমিক অনুশীলন।
        </p>
    </section>

    <section>
        <h2>📚 ২০টি পাঠ</h2>

        <div class="lesson-grid">

            {% for n in range(1, 21) %}
            <a class="lesson-card" href="/quran/lesson/{{ n }}">
                <span class="lesson-number">পাঠ {{ n }}</span>
                <span class="lesson-title">📖 কুরআন শিক্ষা</span>
                <span class="lesson-arrow">শুরু করুন →</span>
            </a>
            {% endfor %}

        </div>
    </section>

    <div class="quran-note">
        💡 <strong>শেখার পরামর্শ:</strong>
        প্রতিদিন অল্প অল্প করে অনুশীলন করুন। সঠিক উচ্চারণ ও তাজবিদ শেখার জন্য
        একজন যোগ্য শিক্ষক বা কারির কাছ থেকে শেখা উত্তম।
    </div>

</main>

</body>
</html>

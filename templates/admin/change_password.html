{% extends "base.html" %}
{% block title %}পাসওয়ার্ড পরিবর্তন | AI Zone বাংলা{% endblock %}
{% block content %}
<h1>🔑 পাসওয়ার্ড পরিবর্তন</h1>
<p class="muted">নতুন পাসওয়ার্ড কমপক্ষে ১২ অক্ষরের হতে হবে।</p>
<form method="post" class="form card">
  <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
  <label>বর্তমান পাসওয়ার্ড<input type="password" name="current_password" required></label>
  <label>নতুন পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)<input type="password" name="new_password" required minlength="12"></label>
  <label>কনফার্ম পাসওয়ার্ড<input type="password" name="confirm_password" required minlength="12"></label>
  <button type="submit" class="btn">পরিবর্তন করুন</button>
  <a href="{{ url_for('admin_dashboard') }}" class="btn outline">বাতিল</a>
</form>
{% endblock %}

{% extends "base.html" %}
{% block title %}ব্লগ | AI Zone বাংলা{% endblock %}
{% block content %}
<h1>📝 ব্লগ</h1>
<div class="grid">
  {% for p in posts %}
  <div class="card">
    <h3>{{ p['title'] }}</h3>
    <small class="muted">{{ p['created_at'] }}</small>
    <p>{{ p['content'][:150] }}...</p>
    <a href="{{ url_for('blog_detail', post_id=p['id']) }}" class="btn-sm">পুরোটা পড়ুন →</a>
  </div>
  {% else %}
  <p>এখনো কোনো পোস্ট নেই।</p>
  {% endfor %}
</div>
{% endblock %}
